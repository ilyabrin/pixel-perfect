name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Pinned in one place: the cache key and the install must never disagree.
  STATICCHECK_VERSION: '2026.2.1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Building staticcheck from source takes about 17 seconds, which was
      # half this job. The binary depends only on its version, so caching it
      # is exact: a miss simply builds it as before.
      #
      # Go module caching is pointless here by contrast, since the project has
      # no third-party dependencies at all.
      - name: Cache staticcheck
        uses: actions/cache@v6
        with:
          path: ~/go/bin/staticcheck
          key: staticcheck-${{ env.STATICCHECK_VERSION }}-${{ runner.os }}

      # Catches what vet does not: unused code, redundant conditions, misuse
      # of the standard library. Pinned so a new release cannot fail CI on an
      # unrelated commit; dependabot bumps it like any other action.
      - name: Staticcheck
        run: |
          command -v staticcheck >/dev/null \
            || go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          staticcheck ./...

      - name: Test with race detector
        run: go test -race -cover ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pp .

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Verifies the Docker image builds and the action wiring works end to end.
      - name: Build the action image
        run: docker build -t pp:ci .
